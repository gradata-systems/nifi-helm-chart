# Default values for nifi.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  busybox:
    repository: busybox

  nifi:
    nodeCount: 1

  serviceAccount:
    # Name of the existing service account to use. If not defined, one is created.
    name: ""
    # Annotations to add to the service account
    annotations: { }

  encryption:
    sensitivePropertiesKey:
      secretRef:
        name: ""
        key: ""

  tls:
    certificate:
      duration: 8760h # 365 days
      renewBefore: 168h # 7 days
      keystorePasswordSecretRef:
        name: ""
        key: password
      issuerRef:
        name: ""
        kind: ClusterIssuer

  ldap:
    url: "" # ldaps://dc-1.example.com:636,ldaps://dc-2.example.com:636
    tlsProtocol: TLSv1.2
    authenticationStrategy: LDAPS # ANONYMOUS|SIMPLE|LDAPS|START_TLS
    identityStrategy: USE_USERNAME # USE_DN|USE_USERNAME
    initialAdminIdentity: "" # CN=Administrator,DC=example,DC=com
    manager:
      distinguishedName: "" # CN=Administrator,DC=example,DC=com
      passwordSecretRef:
        name: ""
        key: ""
    userSearchBase: "" # DC=example,DC=com
    userSearchFilter: sAMAccountName={0}

image:
  repository: apache/nifi
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Set to `true` to pause at startup before loading the application
debugStartup: false

shutdown:
  # Number of seconds to wait for tasks to complete on shutdown, before forcefully terminating them
  gracefulShutdownSeconds: 30 # Consider whether there are any long-running processors defined in the flow
  # Number of seconds Kubernetes allows the pod to stop, before killing it. Covers both the pre-stop hook (which
  # disconnects the node and offloads its queued FlowFiles to the other nodes) and NiFi's graceful shutdown.
  # The pre-stop hook gives up `gracefulShutdownSeconds` + 10 seconds before this deadline, so this must be at least
  # 40 seconds longer than `gracefulShutdownSeconds`. Allow enough time to offload the node's deepest queues.
  podTerminationGracePeriodSeconds: 300

# Limits how many NiFi pods voluntary disruptions (such as `kubectl drain`) can evict at once. Offloading a node sends its
# queued FlowFiles to the remaining nodes, so evicting several nodes together risks offloading to a node that's also
# about to stop.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

ui:
  timeZone: "" # IANA timezone identifier. Time is displayed using this timezone in the UI.
  maxThreads: "" # Maximum number of Jetty threads to use for UI and HTTP site-to-site connections

tls:
  # Additional subject alternative names included in the certificate issued to cluster nodes
  subjectAltNames: [ ]
#    - nifi.internal

logging:
  # Override log verbosity settings in conf/logback.xml
  levels: { }
#    org.apache.nifi.web.security: DEBUG

persistence:
  takeOwnershipOnStartup: true
  config:
    files:
      authorizations: authorizations.xml
      users: users.xml
      flowJson: flow.json.gz
    volumeMount:
      name: data # Name of the volume mount to use
      subPath: conf # Volume mount subPath
  state:
    volumeMount:
      name: data
      subPath: state
  logs:
    volumeMount:
      # Specify a custom mount to persist log data in a separate volume (recommended)
      name: ""
      subPath: ""
  repo:
    # By default, repositories are mapped to a single PVC.
    # If multiple PVCs are desired (for instance, having separate content and provenance repos), override the relevant section.
    flowfile:
      mountDir: flowfile_repository # Relative directory within the container (i.e. /opt/nifi/nifi-current/flowfile_repository)
      volumeName: data # Name of the volume to mount
      subPath: flowfile # Subpath within the mounted volume
    content:
      - name: default
        mountDir: content_repository
        volumeName: data
        subPath: content
    provenance:
      - name: default
        mountDir: provenance_repository
        volumeName: data
        subPath: provenance

ports:
  https: 8443
  cluster: 11443
  remoteinput: 10443
  loadbalance: 6342

service:
  external:
    annotations: { }
    type: LoadBalancer # NodePort | LoadBalancer
    externalTrafficPolicy: Cluster # Cluster | Local

cluster:
  enabled: true
  traffic:
    maxThreads: 100 # Max number of threads used for inter-node communication
  kubernetes:
    leasePrefix: "" # prod-lease
    statePrefix: "" # prod-state

metrics:
  # Expose metrics for each node via Ingress
  enabled: true
  ingress:
    # Metrics are available externally via Ingress for each pod at: metrics.<ingress hostname>/<pod name>
    # Requires `view the user interface` permission to be granted to the cluster user, e.g. `CN=test-nifi.nifi`
    subDomain: metrics
    requireClientCertificate: false

# Optionally deploy a filebeat sidecar to ship NiFi logs to a receiver
filebeat:
  enabled: false
  image:
    repository: docker.elastic.co/beats/filebeat
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext: { }
  volumeMounts: [ ]
  #    - mountPath: /opt/secrets
  #      name: secret
  tags:
    - nifi
  labels: { }
#    instance: production
  processors: [ ]
#    - drop_event:
#        when:
#          regexp:
#            message: "drop_event.*"
  queue:
    flushTimeout: 5s
  output:
    type: "" # kafka
    parameters: { }
#      hosts: ["kafka-1:9092"]
#      topic: nifi

# Additional ports and Ingress rules to configure for each node
extraPorts: { }
#  datafeed:
#    containerPort: 9443
#    protocol: TCP
#    nodePort: 30443 # Set if NodePort is required
#    loadBalancerPort: 9443
#    ingress: # Omit if ingress is not required
#      path: /datafeed
#      pathType: Exact

# Extra config properties to set at runtime
extraConfig:
  nifiProperties: { }
  # nifi.cluster.node.connection.timeout: 5 secs

extraEnv: [ ]
#  - name: MY_VAR
#    value: "some value"

extraVolumes: [ ]
#  - name: my-volume
#    nfs:
#      server: fs.example.com
#      path: /my-volume

extraVolumeMounts: [ ]
#  - mountPath: /data/vol-1
#    name: my-volume

# Additional directories to take ownership of (chown) during startup. Useful where `extraVolumeMounts` are provided.
# Chown is applied to the specified directory only (shallow), not recursively.
extraTakeOwnershipPaths: [ ]
#  - /data/vol-1

ingress:
  # Set to `false` to create no routing resources (equivalent to `controller: custom`)
  enabled: true
  # How NiFi is exposed outside the cluster. See the README for each option's prerequisites.
  #   nginx   - Ingresses for ingress-nginx. ingress-nginx is end-of-life, so prefer another option.
  #   traefik - Ingresses and CRDs (ServersTransport, Middleware, TLSOption, IngressRouteTCP) for Traefik v3
  #   gateway - Gateway API HTTPRoutes, TLSRoutes and a BackendTLSPolicy, attached to an existing Gateway
  #   custom  - No routing resources. Define your own, for example with `extraObjects`.
  controller: nginx
  # Ingress class used by the `nginx` and `traefik` controllers. Defaults to the controller name.
  ingressClassName: ""
  # External host names apply to every controller. NiFi only accepts requests for these host names, and they're
  # included in the certificates issued to the nodes.
  hostName: example.com # nifi.example.com
  siteToSite:
    subDomain: s2s # Subdomain for site-to-site traffic (e.g. s2s.example.com)
  # Annotations to add to the UI Ingress or HTTPRoute (and the site-to-site Ingress, for `nginx`)
  annotations: { }

  traefik:
    # Entry points to serve on. They must accept TLS connections. Leave empty to use all entry points.
    entryPoints:
      - websecure

  gateway:
    # Gateway listener(s) for HTTPS traffic to the UI, metrics and `extraPorts` Ingress paths. Required.
    # The listener terminates TLS for `ingress.hostName` and the metrics host name. It can use the chart's `<release>-tls` secret.
    parentRefs: [ ]
    #  - name: shared-gateway
    #    namespace: gateway-system
    #    sectionName: https
    metrics:
      # Gateway listener(s) for the metrics host name. Defaults to `parentRefs`.
      # NiFi only returns metrics to an authorised client, so the Gateway must present a client certificate (such as the
      # `<release>-tls` secret) to NiFi. Use a separate Gateway for this: a Gateway's backend client certificate applies to
      # every route attached to it, which would authenticate UI users as the certificate's identity.
      parentRefs: [ ]
    siteToSite:
      # Gateway listener(s) with `protocol: TLS` and `tls.mode: Passthrough` that accept the site-to-site host names
      # (`s2s.<hostName>` and `*.s2s.<hostName>`). Leave empty to create no site-to-site routes.
      parentRefs: [ ]
      #  - name: shared-gateway
      #    namespace: gateway-system
      #    sectionName: s2s
    # Keeps each session on the same node, which NiFi requires: login tokens are only valid on the node that issued them.
    # `sessionPersistence` is in the Gateway API experimental channel. If your Gateway implementation doesn't support it,
    # configure session affinity in the implementation instead, or users will be logged out at random.
    sessionPersistence:
      sessionName: nifi-session
      type: Cookie
    # CA certificates the Gateway uses to verify NiFi's server certificate. Defaults to the `ca.crt` of the chart's
    # `<release>-tls` secret. Use a ConfigMap if your Gateway implementation doesn't support Secret references.
    backendTLS:
      caCertificateRefs: [ ]
      #  - group: ""
      #    kind: ConfigMap
      #    name: nifi-ca
    # Create a ReferenceGrant so Gateways in other namespaces (from `parentRefs`) can use the `<release>-tls` secret
    createReferenceGrant: true
    # Override the API versions detected from the cluster (useful with `helm template`)
    apiVersions:
      backendTLSPolicy: "" # gateway.networking.k8s.io/v1
      tlsRoute: "" # gateway.networking.k8s.io/v1alpha2

# Additional Kubernetes manifests to deploy with the chart, such as custom Ingresses or routes.
# Each entry is either an object or a string, and is rendered as a template.
extraObjects: [ ]
#  - apiVersion: networking.k8s.io/v1
#    kind: Ingress
#    metadata:
#      name: '{{ include "nifi.fullname" . }}-custom'
#    spec: { }

jvmHeap:
  min: 512m
  max: 1g

resources:
  requests:
    cpu: 500m
    memory: 2Gi

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true

# Set a custom umask for the `nifi` user
umask: "" # "0002"

volumeClaims: { }
#  data:
#    storageClassName: ""
