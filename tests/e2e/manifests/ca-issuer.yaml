# A private CA that issues every certificate in the test cluster (NiFi nodes, the chart's ingress certificate)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nifi-e2e-selfsigned
spec:
  selfSigned: { }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nifi-e2e-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: nifi-e2e-ca
  secretName: nifi-e2e-ca
  duration: 87600h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: nifi-e2e-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nifi-e2e-ca
spec:
  ca:
    secretName: nifi-e2e-ca
